# ---- Spelling and language ----------------------------------------------------------------
# Local pyspellchecker dictionary + src/pps_ats/resources/tech_terms.txt (+ extra words here).
[analysis.language]
enabled = true
dictionary_language = "en"
max_findings = 40
min_word_length = 3
extra_allowed_words = []
skip_sections = ["contact"]

# =============================================================================
# Milestone 3 — PROVISIONAL CA1 rubric scoring and ATS compatibility.
# These weights are a starting point for faculty calibration, NOT validated marks.
# They were not fitted to previous Excel marks (those are not treated as ground truth).
# Change rubric_version whenever any value below changes; it is stored with every score.
# =============================================================================
[scoring]
rubric_version = "CA1-provisional-1"
rounding = 0.5                   # marks are rounded to this step
boundary_margin = 0.25           # raw score this close to a band edge => flagged
scale_by_confidence = true       # deduction x finding confidence
default_group_cap = 3.0

[scoring.criteria.content_relevance]
label = "Content & Relevance"
max_points = 10
floor = 1
ceiling = 9
ceiling_note = "9-10 also requires tailoring to the role and clear goals, which deterministic checks cannot verify; an AI evaluation or faculty review can award the final mark."

[scoring.criteria.structure_formatting]
label = "Structure & Formatting"
max_points = 10
floor = 1
ceiling = 10

[scoring.criteria.language_professional_tone]
label = "Language & Professional Tone"
max_points = 10
floor = 1
ceiling = 10

[[scoring.bands]]
name = "excellent"
min_score = 9

[[scoring.bands]]
name = "good"
min_score = 6

[[scoring.bands]]
name = "needs_improvement"
min_score = 0

# Nominal deduction per finding: finding_class -> severity -> marks.
[scoring.class_points.definite_defect]
high = 1.5
medium = 1.0
low = 0.5
info = 0.0

[scoring.class_points.potential_issue]
high = 0.75
medium = 0.5
low = 0.25
info = 0.0

[scoring.class_points.recommendation]
high = 0.2
medium = 0.15
low = 0.1
info = 0.0

# Maximum deduction per criterion from one group (prevents one problem type dominating).
[scoring.groups.placeholder]
max_points = 4.0
[scoring.groups.section_completeness]
max_points = 5.0
[scoring.groups.content_quality]
max_points = 3.5
[scoring.groups.formatting]
max_points = 4.0
[scoring.groups.layout]
max_points = 2.0
[scoring.groups.contact]
max_points = 2.0
[scoring.groups.spelling]
max_points = 2.5
[scoring.groups.grammar]
max_points = 1.5
[scoring.groups.style]
max_points = 1.5

# Rule-specific settings (points / group / max_count / criterion).
[scoring.rules.SEC_REQUIRED_MISSING]
points = 2.0
[scoring.rules.SEC_CONTACT_MISSING]
points = 2.0
# SEC_EMPTY / SEC_PLACEHOLDER_ONLY use the class x severity table: the analysis marks them
# high for required sections and medium for optional ones.
[scoring.rules.CQ_PROJECT_NO_DESCRIPTION]
points = 1.5
[scoring.rules.CQ_REPEATED_LINE]
max_count = 3
[scoring.rules.LANG_SPELLING]
points = 0.4
max_count = 8
[scoring.rules.FMT_MIXED_BODY_FONTS]
points = 0.75
max_count = 3                    # one inconsistency, many locations: count it a few times
[scoring.rules.FMT_SMALL_TEXT]
max_count = 3
[scoring.rules.CQ_WEAK_VERB]
group = "style"
max_count = 5
[scoring.rules.CQ_FILLER_PHRASE]
group = "style"
max_count = 5
[scoring.rules.IDENTITY_NAME_NOT_FOUND]
points = 0.5

# A section-level finding already penalises the line-level findings it summarises.
# Rules added after the faculty calibration pilot: reported with evidence but worth
# 0 CA1 points until faculty calibrate them (CA1 weights are unchanged).
[scoring.rules.CONTACT_LINKEDIN_MISSING]
points = 0
[scoring.rules.CONTACT_CODE_PROFILE_MISSING]
points = 0
[scoring.rules.CONTACT_LINK_TEXT_ONLY]
points = 0
[scoring.rules.CONTACT_PLACEHOLDER_LINK]
points = 0
[scoring.rules.CONTACT_EMAIL_MALFORMED]
points = 0
[scoring.rules.CONTACT_PHONE_INCOMPLETE]
points = 0
[scoring.rules.CONTACT_DETAILS_MULTILINE]
points = 0
[scoring.rules.CQ_PROJECT_TEAM_ROLE_UNCLEAR]
points = 0
[scoring.rules.CQ_PROJECT_NO_OUTCOME]
points = 0
[scoring.rules.CQ_OBJECTIVE_NO_TARGET]
points = 0

[scoring.supersedes]
SEC_PLACEHOLDER_ONLY = ["PH_*"]
SEC_EMPTY = ["PH_EMPTY_FIELD"]
CQ_PROJECT_NO_DESCRIPTION = ["PH_EMPTY_FIELD", "CQ_PROJECT_*"]

# Optional contextual evaluation. Disabled by default: no model is called and nothing
# leaves the machine. An enabled evaluator can only nudge each criterion by max_adjustment.
[scoring.ai]
enabled = false
max_adjustment = 1.0
min_confidence = 0.7
review_disagreement = 1.5
redact_personal_data = true
require_evidence = true          # every AI claim must quote the document verbatim
min_evidence_chars = 8
# Provider (Milestone 5). Disabled unless enabled = true AND provider is set.
#   "local"    OpenAI-compatible server on this computer only (Ollama, llama.cpp, LM Studio)
#   "external" remote API: also needs allow_external = true and external_authorised_by
provider = "none"
base_url = "http://127.0.0.1:11434/v1"
model = ""                       # e.g. "qwen2.5:7b-instruct" (pulled into the local server)
request_timeout_s = 120
temperature = 0.0
seed = 7
max_section_chars = 3000
allow_external = false
external_authorised_by = ""      # name/role and date of the approval for external use
api_key_env = "PPS_ATS_AI_API_KEY"

# ATS compatibility score (0-100), reported separately from CA1.
[scoring.ats]
base = 100
max_per_rule = 15
[scoring.ats.severity_points]
high = 10
medium = 6
low = 3
info = 0
[scoring.ats.rule_points]
SEC_CONTACT_MISSING = 20
CONTACT_EMAIL_MISSING = 10
CONTACT_PHONE_MISSING = 4
SEC_REQUIRED_MISSING = 8
SEC_EMPTY = 3
SEC_PLACEHOLDER_ONLY = 4
PH_GENERIC_EMAIL = 10
PH_GENERIC_PHONE = 6
IDENTITY_NAME_NOT_FOUND = 5
[scoring.ats.bands]
good = 80
fair = 60

# ---------------------------------------------------------------- Milestone 4: reports
[reports]
annotate_pdf = true          # annotated copy of each analysed PDF (original never modified)
findings_report = "docx"     # separate findings PDF for "docx" | "all" | "none"
clip_margin_x = 2.0          # widen a finding's span box (pt) when searching for its text
clip_margin_y = 1.0
excel_text_limit = 500

# ---------------------------------------------------------------- Milestone 4: batch
[batch]
workers = 1                  # parallel worker processes (each opens one document at a time)
max_workers = 4              # upper bound for --workers
document_timeout_s = 120     # active seconds per document before its worker is stopped;
                             # 0 = no limit and run documents in the main process
suspend_gap_s = 15           # pauses longer than this = PC asleep; not charged to a document
prevent_sleep = true         # Windows: request the PC stays awake during a batch
ignore_names = ["desktop.ini", "thumbs.db", ".ds_store"]   # OS files, listed in the summary
ignore_prefixes = ["~$", "._"]                               # Office lock / macOS resource files
synced_markers = ["onedrive", "dropbox", "google drive", "icloud"]

# ---------------------------------------------------------------- Milestone 5: evaluation
# Compares scanner output with faculty-corrected references (see docs/EVALUATION.md).
[evaluation]
text_match_threshold = 0.5        # faculty quote vs scanner text similarity to count a match
high_severity_levels = ["high"]   # scanner severities treated as high
high_severity_classes = ["definite_defect"]  # ... and these finding classes
bootstrap_samples = 2000          # paired bootstrap for the A-vs-B comparison
seed = 13

# Canonical faculty issue labels -> scanner rules (fnmatch) and AI aspects ("AI:<aspect>").
[evaluation.labels]
placeholder = ["PH_*", "SEC_PLACEHOLDER_ONLY"]
missing_section = ["SEC_REQUIRED_MISSING", "SEC_RECOMMENDED_MISSING"]
empty_section = ["SEC_EMPTY"]
contact = ["SEC_CONTACT_MISSING", "CONTACT_*"]
spelling = ["LANG_SPELLING"]
grammar = ["LANG_LOWERCASE_I", "LANG_NO_SPACE_AFTER_PUNCT", "LANG_REPEATED_WORD",
           "LANG_SPACE_BEFORE_PUNCT", "AI:contextual_grammar"]
formatting = ["FMT_*"]
layout = ["LAYOUT_*"]
career_objective = ["CQ_OBJECTIVE_*", "AI:career_objective"]
project_description = ["CQ_PROJECT_*", "AI:project_description"]
weak_language = ["CQ_WEAK_VERB", "CQ_FILLER_PHRASE", "AI:professional_tone"]
education_details = ["CQ_EDUCATION_INCOMPLETE"]
certification_details = ["CQ_CERTIFICATION_DETAILS"]
duplicate_content = ["CQ_REPEATED_LINE", "CQ_NEAR_DUPLICATE_LINE"]
identity = ["IDENTITY_*"]
uncertain_structure = ["SEC_UNCERTAIN", "FMT_GARBLED_TEXT"]
# Faculty labels with no scanner rule yet: always counted as missed, never as detected.
section_title = []               # "title as skills", "rename section to ..."
section_order = []               # "mention before skills", "move ... above ..."
other_feedback = []              # faculty advice that fits no label (kept, not scored)

# AI assistance is recommended for a pilot only if ALL of these hold on the held-out split.
[evaluation.ai_adoption]
min_documents = 30                 # faculty-marked evaluation documents
min_total_mae_improvement = 0.25   # marks /30
max_criterion_mae_increase = 0.0   # no criterion may get worse
max_high_severity_fn_increase = 0
max_high_severity_fp_increase = 0
require_ci_excludes_zero = true    # 95% paired-bootstrap CI of the total-MAE change < 0

[evaluation.fine_tuning]
min_paired_documents = 500         # faculty-marked + fully annotated, calibration split
min_evaluation_documents = 100     # held-out, never used for tuning

# ---------------------------------------------------------------- import of teacher corrections
# Used only by `import-corrections` to SUGGEST a canonical label for a teacher comment.
# One matching label => suggested (still reviewable); several or none => needs_review.
[evaluation.import]
red_min = 0.6                     # a span/drawing is "red" if R >= red_min ...
red_max_other = 0.35              # ... and G, B <= red_max_other
high_severity_words = ["must", "major", "critical", "serious", "incorrect", "wrong", "missing"]
low_severity_words = ["minor", "optional", "consider", "could", "suggest", "maybe"]
corrected_suffixes = ["_corrected", "-corrected", "_reviewed", "-reviewed", "_annotated",
                      "-annotated", "_checked", "-checked", " (corrected)"]

[evaluation.import.keywords]
spelling = ["spelling", "spell", "typo", "misspel"]
grammar = ["grammar", "tense", "punctuation", "article", "sentence structure", "subject-verb"]
placeholder = ["placeholder", "template", "lorem", "your name", "fill in", "dummy", "sample text"]
missing_section = ["missing section", "add section", "add a section", "section missing", "no section"]
empty_section = ["empty section", "section is empty", "blank section", "nothing under"]
contact = ["contact", "email", "e-mail", "phone", "mobile", "linkedin", "github"]
formatting = ["format", "font", "alignment", "align", "spacing", "margin", "bold", "indent", "bullet"]
layout = ["layout", "column", "table", "text box", "header", "footer", "photo"]
career_objective = ["objective", "summary", "career goal", "profile statement"]
project_description = ["project", "description", "contribution", "tech stack", "technologies used"]
weak_language = ["weak", "vague", "generic", "passive", "action verb", "informal", "tone", "casual", "filler"]
education_details = ["education", "cgpa", "gpa", "percentage", "degree", "year of passing",
                     "10th", "12th", "ssc", "hsc"]
certification_details = ["certification", "certificate"]
duplicate_content = ["duplicate", "repeated", "repetition", "redundant"]
identity = ["name mismatch", "wrong name", "not your resume", "someone else"]

# Instruction patterns (regular expressions on the lower-cased comment) for corrected-only
# intake. They are tried before the keywords; one matching label => suggested,
# several => needs_review. Tuned on the example instructions supplied with the request,
# not on the faculty files themselves.
[evaluation.import.patterns]
section_title = ['^(title|retitle|rename)\b', '\btitle (it |this )?as\b', '\brename (the )?(section|heading)\b', '\bheading (should be|as)\b']
section_order = ['\b(before|after|above|below)\s+(the\s+)?(skills|education|projects?|experience|internships?|summary|objective|certifications?|achievements|participation)\b', '^move\b', '\border of (the )?sections\b']
missing_section = ['^(pl(ease|z)\s+)?add (a |an |the )?(career objective|objective|summary|profile|skills|projects?|experience|internships?|certifications?|achievements|hobbies|declaration|languages)\b']
education_details = ['\b(10th|12th|ssc|hsc|class (x|xii|10|12)|cgpa|sgpa|percentage|year of passing)\b']
weak_language = ['action[- ]oriented', '\baction verbs?\b', '\bconcise\b', '\bpassive\b']
project_description = ['\bindividual contribution\b', '\byour contribution\b', '\btech(nology)? stack\b', '\bproject description\b']
career_objective = ['\bobjective (is|should|needs|must)\b', '\bgeneric objective\b']
