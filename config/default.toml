# ---- Contact presentation (faculty pilot) --------------------------------------------------
[analysis.contact]
enabled = true
profile_labels = ["linkedin", "github", "gitlab", "portfolio"]
placeholder_hosts = ["example.com", "yourwebsite.com", "website.com", "domain.com",
                     "yourportfolio.com", "yourname.com", "portfolio.com"]
placeholder_handles = ["yourname", "your-name", "your_name", "yourprofile", "username",
                       "user-name", "user_name", "name", "xyz", "abc", "example", "profile",
                       "handle", "yourhandle", "your-handle"]
multiline_min_lines = 3
[analysis.contact.profile_hosts]
linkedin = ["linkedin"]
code = ["github", "gitlab", "bitbucket", "portfolio", "behance", "dribbble", "kaggle",
        "leetcode", "hackerrank", "codechef", "codeforces", "huggingface"]
[analysis.contact.label_hosts]
