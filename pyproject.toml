[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "pps-ats"
version = "0.1.0"
description = "Local ATS-style resume validation, parsing, evidence-based analysis and (later) faculty grading engine."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
dependencies = [
    "pymupdf>=1.24",
    "python-docx>=1.1",
    "pydantic>=2.7,<3",
    "pyspellchecker>=0.8",  # local, offline spelling dictionary (Milestone 2)
    "openpyxl>=3.1",  # Excel workbook (Milestone 4)
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.5",
]

[project.scripts]
pps-ats = "pps_ats.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/pps_ats"]

# Ship the default configuration inside non-editable wheels as well.
[tool.hatch.build.targets.wheel.force-include]
"config/default.toml" = "pps_ats/_default_config.toml"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
